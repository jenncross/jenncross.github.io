<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index of Test Apps and Web Experiments</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        .experiment-list {
            list-style: none;
            padding: 0;
        }
        .experiment-list li {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 4px;
            transition: background 0.3s ease;
        }
        .experiment-list li:hover {
            background: #e9ecef;
        }
        .experiment-list a {
            color: #2980b9;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1em;
        }
        .experiment-list a:hover {
            color: #3498db;
            text-decoration: underline;
        }
        .description {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Index of Test Apps and Web Experiments</h1>
    
    <ul class="experiment-list">
        <li>
            <a href="./smartplaygroundapp/">Smart Playground App</a>
            <div class="description">Bluetooth-enabled communication app for Smart Playground hub</div>
        </li>
        <!-- Add more experiments here -->
    </ul>
</body>
</html>
